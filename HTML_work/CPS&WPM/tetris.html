<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        canvas { background: #000; display: block; margin: auto; }
    </style>
</head>
<body>
    <h1>Tetris</h1>
    <canvas id="tetris" width="300" height="600"></canvas>
    <script>
        const canvas = document.getElementById("tetris");
        const context = canvas.getContext("2d");
        context.scale(30, 30);

        const ROWS = 20;
        const COLUMNS = 10;

        function createMatrix(w, h) {
            return Array.from({ length: h }, () => Array(w).fill(0));
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        context.fillStyle = "red";
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function collide(arena, player) {
            return player.matrix.some((row, y) => 
                row.some((value, x) => value && (arena[y + player.pos.y]?.[x + player.pos.x]) !== 0)
            );
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = "black";
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, { x: 0, y: 0 });
            drawMatrix(player.matrix, player.pos);
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerRotate() {
            const temp = player.matrix;
            player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[i])).reverse();
            if (collide(arena, player)) {
                player.matrix = temp;
            }
        }

        function playerReset() {
            player.matrix = [[1, 1, 1], [0, 1, 0]]; 
            player.pos.y = 0;
            player.pos.x = Math.floor(COLUMNS / 2) - Math.floor(player.matrix[0].length / 2);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                alert("Game Over");
            }
        }

        let dropCounter = 0;
        let lastTime = 0;
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > 1000) {
                playerDrop();
            }
            draw();
            requestAnimationFrame(update);
        }

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") playerMove(-1);
            else if (event.key === "ArrowRight") playerMove(1);
            else if (event.key === "ArrowDown") playerDrop();
            else if (event.key === "ArrowUp") playerRotate();
        });

        const arena = createMatrix(COLUMNS, ROWS);
        const player = { pos: { x: 5, y: 0 }, matrix: [[1, 1, 1], [0, 1, 0]] };
        update();
    </script>
</body>
</html>
