    <style>
        body {

            align-items: center;

            text-align: center;
            text-decoration: none;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #900;
        }

        .test img {
            width: 200px;
            height: auto;
        }
    </style>
